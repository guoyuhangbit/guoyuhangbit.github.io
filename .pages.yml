        type: string
        description: 例如 2025，用于 T1、T2、T3 标签的悬停说明。
      - name: checked_on
        label: 核对日期
        type: string
        pattern: '^$|^\d{4}-\d{2}-\d{2}$'
        description: 例如 2026-09-12。
