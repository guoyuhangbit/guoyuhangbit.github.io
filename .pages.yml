  - name: site
    label: 基本资料与链接
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: name
        label: 中文姓名
        type: string
        required: true
      - name: name_en
        label: 英文姓名
        type: string
        required: true
      - name: affiliation
        label: 所在单位
        type: string
        required: true
      - name: affiliation_en
        label: 单位英文名称
        type: string
      - name: scholar
        label: Google Scholar 网址
        type: string
        pattern: '^$|^https?://[^\s]+$'
      - name: acl_anthology
        label: ACL Anthology 网址
        type: string
        pattern: '^$|^https?://[^\s]+$'
      - name: github
        label: 研究组 GitHub 网址
        type: string
        pattern: '^$|^https?://[^\s]+$'
      - name: orcid
        label: ORCID 网址
        type: string
        pattern: '^$|^https?://[^\s]+$'
      - name: faculty
        label: 学院个人页网址
        type: string
        pattern: '^https?://[^\s]+$'
        required: true
      - name: course_url
        label: 数据结构课件网址
        type: string
        pattern: '^$|^https?://[^\s]+$'
        description: 尚未发布时留空；填写后，课程页面自动显示进入课件的按钮。
      - name: updated
        label: 页面更新日期
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
        required: true
        description: 例如 2026-09-12。
