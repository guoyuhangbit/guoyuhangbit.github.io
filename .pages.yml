          - name: ccf_rank
            label: CCF 等级
            type: select
            description: 按对应目录选择；未列入或未经核实的成果留空。
            options:
              values: ["A", "B", "C", "T1", "T2", "T3"]
          - name: ccf_source
            label: CCF 等级来源网址
            type: string
            pattern: '^$|^https?://[^\s]+$'
            description: 填写后，访客可点击 CCF 标签查看依据。
          - name: indexing
            label: 期刊收录类别
            type: select
            description: 仅为期刊论文填写，按已核实的期刊类别选择；不用于会议论文。
            options:
              values: ["SCIE", "ESCI"]
          - name: indexing_source
            label: 期刊收录类别来源网址
            type: string
            pattern: '^$|^https?://[^\s]+$'
            description: 填写后，访客可点击期刊类别标签查看依据。
