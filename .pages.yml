settings:
  content:
    merge: true
  commit:
    identity: app
content:
  - name: page
    label: 页面文字
    type: file
    path: content/page.json
    format: json
    operations:
      delete: false
    fields:
      - name: home
        label: 首页介绍
        type: object
        fields:
          - name: intro
            label: 个人简介
            type: text
      - name: research
        label: 研究方向
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{title}'
        fields:
          - name: id
            label: 方向标识
            type: string
            required: true
            pattern: '^[a-z][a-z0-9-]*$'
            description: 使用英文小写字母和连字符，例如 language。
          - name: title
            label: 中文名称
            type: string
            required: true
          - name: title_en
            label: 英文名称
            type: string
          - name: label
            label: 英文简称
            type: string
          - name: text
            label: 研究介绍
            type: text
          - name: keywords
            label: 关键词
            type: string
      - name: students
        label: 面向学生
        type: object
        fields:
          - name: title
            label: 标题
            type: string
          - name: text
            label: 介绍
            type: text
          - name: topics
            label: 研究主题
            type: string
            list: true
      - name: collaboration
        label: 学术与项目合作
        type: object
        fields:
          - name: title
            label: 标题
            type: string
          - name: text
            label: 介绍
            type: text
          - name: invitation
            label: 联系说明
            type: text
